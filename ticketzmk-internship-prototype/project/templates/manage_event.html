{% extends "layout.html" %}
{% block title %}Manage {{ event.host }} · TicketZMK{% endblock %}
{% block content %}
<section class="form-card wide manage-card"><a class="back-link" href="{{ url_for('organizer') }}">← Organizer dashboard</a><p class="eyebrow">Your event</p><h1>Manage listing</h1><p>Only the organizer who created this listing can edit or cancel it.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Event title<input name="host" required maxlength="120" value="{{ event.host }}"></label><div class="form-row"><label>Category<select name="event_type"><option value="football" {{ 'selected' if event.event_type == 'football' }}>Football</option><option value="gospel" {{ 'selected' if event.event_type == 'gospel' }}>Gospel</option><option value="secular" {{ 'selected' if event.event_type == 'secular' }}>Secular</option></select></label><label>City<input name="city" required maxlength="80" value="{{ event.city }}"></label></div><label>Venue<input name="venue" required maxlength="160" value="{{ event.venue }}"></label><label>Date and time<input name="date_time" required value="{{ event.date_time }}"></label><div class="form-row"><label>Ticket quantity<input name="ticket_count" type="number" min="1" required value="{{ event.ticket_count }}"></label><label>Price per ticket (ZMW)<input name="price" type="number" min="0.01" step="0.01" required value="{{ '%.2f'|format(event.price_cents / 100) }}"></label></div><label>Event details<textarea name="description" rows="5" required maxlength="2000">{{ event.ticketinfo }}</textarea></label><button type="submit">Save event details</button></form><hr><form action="{{ url_for('cancel_event', event_id=event.id) }}" method="post" onsubmit="return confirm('Cancel this event? It will disappear from public listings.');"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button-danger" type="submit">Cancel event</button></form></section>
{% endblock %}
